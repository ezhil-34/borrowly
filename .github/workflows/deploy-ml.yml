name: Deploy Python ML Service to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'ml_project/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ml_project
        run: |
          pip install -r requirements.txt

      - name: Create deployment package
        run: |
          cd ml_project
          zip -r ../ml_deploy.zip . -x "__pycache__/*" -x "*.ipynb" -x ".ipynb_checkpoints/*"

      - name: Deploy to Azure Web App (ML)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_ML_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_ML_WEBAPP_PUBLISH_PROFILE }}
          package: ml_deploy.zip
